name: Refresh outages

on:
  # Shaped to when the water utilities actually publish, measured over 225 announcements
  # in data/fixtures: 07:00 and 08:00 local carry a third of the day between them, 05:00
  # to 10:00 carries half, and nothing has ever been posted between 23:00 and 05:00.
  #
  # Hourly through the morning, every second hour through the tail, nothing overnight --
  # thirteen runs a day rather than twenty-four. Electricity does not mind either way,
  # since EPS publishes planned works days ahead; water is same-day, and the morning is
  # where a two-hour lag would actually cost a reader something.
  #
  # Cron is UTC and the hours above are local, so each window is widened by an hour to
  # hold for both CET and CEST rather than shifting twice a year.
  schedule:
    - cron: '10 3-9 * * *'
    - cron: '10 10-20/2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect outages
        run: npm run data

      - name: Send notifications
        env:
          PUBLIC_VAPID_KEY: ${{ secrets.PUBLIC_VAPID_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_ADMIN_ORIGIN: ${{ secrets.PUSH_ADMIN_ORIGIN }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: npm run notify

      - name: Commit dataset
        run: |
          git config user.name "nemaleba-bot"
          git config user.email "bot@nemaleba.rs"
          git add static/data
          git diff --staged --quiet || git commit -m "Refresh outage data"
          git push

      - name: Build site
        env:
          PUBLIC_API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          PUBLIC_VAPID_KEY: ${{ secrets.PUBLIC_VAPID_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
          # The free tier allows 500 MB of artifact storage and the site is 61 MB, so a
          # handful of retained runs would fill it. Nothing reads this after the deploy
          # job in the same run has taken it.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
